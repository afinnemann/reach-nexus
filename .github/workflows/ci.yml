# REACH Nexus — site CI
# Runs on every push and pull request:
#  1. Validate JSON data files.
#  2. Re-run the build and confirm there is no diff (catches stale generated HTML).
#  3. Validate HTML.
#  4. Check links with lychee.
#  5. Run pa11y-ci accessibility checks against a representative subset of pages.

name: site-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jinja2
        run: python -m pip install jinja2

      - name: Validate JSON schemas
        run: python build.py --check

      - name: Build site
        run: python build.py

      - name: Confirm regenerated HTML is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated HTML is out of date. Run 'python3 build.py' locally and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Validate HTML (W3C Nu)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          extra: --ignore-re ".*hreflang=\"x-default\".*"

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: |
            --no-progress
            --max-concurrency 4
            --exclude-mail
            --exclude '^https?://localhost'
            --exclude '^https?://reach-nexus\.github\.io'
            'en/**/*.html'
            'pt/**/*.html'

  accessibility:
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: python -m pip install jinja2
      - run: python build.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Serve site
        run: |
          python3 -m http.server 8000 &
          sleep 2

      - name: Run pa11y-ci against representative pages
        run: |
          pa11y-ci \
            --standard WCAG2AA \
            http://localhost:8000/en/ \
            http://localhost:8000/en/sites/ \
            http://localhost:8000/en/sites/jardim-pantanal.html \
            http://localhost:8000/en/team.html \
            http://localhost:8000/en/work-packages/ \
            http://localhost:8000/en/about/ \
            http://localhost:8000/en/funding.html \
            http://localhost:8000/en/contact.html \
            http://localhost:8000/pt/ \
            http://localhost:8000/pt/sites/jardim-pantanal.html
